<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070707"><title>DIGITAL STRATEGIST</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');:root{--bg:#070707;--panel:#0d0d0d;--line:#242424;--text:#f5f5f5;--muted:#888;--gold:#d6b15d;--gold2:#f0d48a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input{font:inherit}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(410px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:34px}.brand-auth{text-align:center;color:var(--gold);font-weight:700;letter-spacing:.1em;margin-bottom:44px}.google{width:100%;background:#fff;color:#111;border:0;padding:13px;border-radius:8px;font-weight:600;cursor:pointer}.note{color:var(--muted);font-size:11px;text-align:center;line-height:1.6;margin-top:14px}.sidebar{width:240px;border-right:1px solid var(--line);padding:26px 16px;position:fixed;inset:0 auto 0 0;background:#080808;z-index:10}.brand{font-size:18px;font-weight:700;letter-spacing:.08em;color:var(--gold);padding:0 12px 28px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#999;text-align:left;padding:12px;border-radius:9px;cursor:pointer}.nav button:hover,.nav button.active{background:#15130e;color:var(--gold2)}.main{margin-left:240px;padding:34px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.title{font-size:25px;font-weight:700}.subtitle{color:var(--muted);font-size:13px;margin-top:6px}.user{border:1px solid var(--line);padding:9px 12px;border-radius:9px;color:#aaa;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}.metric-label{color:var(--muted);font-size:12px}.metric-value{font-size:26px;font-weight:600;margin-top:12px}.section{margin-top:20px}.section h2{font-size:15px;margin:0 0 12px}.empty{padding:42px 20px;text-align:center;color:var(--muted);border:1px dashed #292929;border-radius:12px}.form-card{max-width:720px}.upload{border:1px dashed #333;border-radius:12px;padding:34px;text-align:center}.upload input{display:none}.upload label{display:inline-block;padding:11px 16px;border:1px solid var(--gold);color:var(--gold2);border-radius:8px;cursor:pointer}.preview{max-width:260px;max-height:360px;display:block;margin:18px auto;border-radius:10px}.primary{margin-top:14px;width:100%;border:0;background:var(--gold);color:#080808;padding:13px;border-radius:8px;font-weight:700;cursor:pointer}.primary:disabled{opacity:.35;cursor:not-allowed}.chat{height:calc(100vh - 150px);display:flex;flex-direction:column}.messages{flex:1;border:1px solid var(--line);border-radius:12px;padding:18px;overflow:auto}.bubble{max-width:80%;padding:11px 13px;border-radius:10px;margin-bottom:10px;font-size:13px;line-height:1.5}.bubble.system{background:#121212;color:#999}.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1;background:#101010;border:1px solid var(--line);color:#fff;padding:12px;border-radius:8px;outline:none}.composer button{border:1px solid var(--gold);background:transparent;color:var(--gold2);padding:0 18px;border-radius:8px}.mobile-menu{display:none}@media(max-width:800px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0;padding:20px}.mobile-menu{display:block;background:transparent;border:1px solid var(--line);color:#fff;border-radius:8px;padding:8px 10px}.grid{grid-template-columns:repeat(2,1fr)}.user{display:none}}@media(max-width:480px){.card{padding:15px}.metric-value{font-size:21px}}</style></head><body><section id="auth" class="auth"><div class="auth-card"><div class="brand-auth">DIGITAL STRATEGIST</div><button id="googleBtn" class="google">Continuar com Google</button><div class="note">A autenticação Google será conectada na próxima etapa. Nenhuma conta ou dado fictício é criado nesta versão.</div></div></section><div id="app" class="hidden"><aside id="sidebar" class="sidebar"><div class="brand">DIGITAL STRATEGIST</div><nav class="nav"><button data-page="dashboard" class="active">Dashboard</button><button data-page="scanner">Scanner diário</button><button data-page="history">Histórico</button><button data-page="chat">Chat IA</button><button data-page="tools">Ferramentas</button><button data-page="admin">Administração</button></nav></aside><main class="main"><div class="top"><div><button id="mobileMenu" class="mobile-menu">☰</button><div id="pageTitle" class="title"></div><div id="pageSubtitle" class="subtitle"></div></div><div class="user">Conta Google • aguardando conexão</div></div><div id="content"></div></main></div><script>const pages={dashboard:{title:'Dashboard',sub:'Acompanhamento de métricas',html:'<div class="grid"><div class="card"><div class="metric-label">Seguidores</div><div class="metric-value">—</div></div><div class="card"><div class="metric-label">Posts</div><div class="metric-value">—</div></div><div class="card"><div class="metric-label">Seguindo</div><div class="metric-value">—</div></div><div class="card"><div class="metric-label">Último envio</div><div class="metric-value">—</div></div></div><div class="section"><h2>Histórico das métricas</h2><div class="empty">Nenhum envio registrado ainda.</div></div>'},scanner:{title:'Scanner diário',sub:'Envie o print do perfil do Instagram',html:'<div class="card form-card"><div class="upload"><input id="imageInput" type="file" accept="image/*"><label for="imageInput">Selecionar print</label><div id="previewBox"></div></div><button id="sendBtn" class="primary" disabled>LER E ENVIAR</button><div id="scanStatus" class="note">A análise por IA será conectada posteriormente. Nesta etapa, o arquivo apenas é preparado para envio.</div></div>'},history:{title:'Histórico',sub:'Registros enviados pelo colaborador',html:'<div class="empty">Nenhum registro disponível.</div>'},chat:{title:'Chat IA',sub:'Comunicação com o assistente',html:'<div class="chat"><div class="messages"><div class="bubble system">IA ainda não configurada. Esta interface está pronta para receber a integração posteriormente.</div></div><div class="composer"><input id="chatInput" placeholder="Digite uma mensagem..."><button id="chatSend">Enviar</button></div></div>'},tools:{title:'Ferramentas',sub:'Recursos da plataforma',html:'<div class="grid"><div class="card"><div class="metric-label">Ferramentas</div><div class="metric-value">—</div><div class="note">Nenhuma ferramenta ativa.</div></div></div>'},admin:{title:'Administração',sub:'Colaboradores e envios',html:'<div class="grid"><div class="card"><div class="metric-label">Colaboradores</div><div class="metric-value">—</div></div><div class="card"><div class="metric-label">Envios recebidos</div><div class="metric-value">—</div></div></div><div class="section"><div class="empty">A área administrativa está preparada. Os dados aparecerão após a conexão do banco e da autenticação.</div></div>'}};function render(page){const p=pages[page];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));pageTitle.textContent=p.title;pageSubtitle.textContent=p.sub;content.innerHTML=p.html;if(page==='scanner'){imageInput.onchange=e=>{const f=e.target.files[0];if(!f)return;previewBox.innerHTML='<img class="preview" src="'+URL.createObjectURL(f)+'" alt="Print selecionado">';sendBtn.disabled=false;scanStatus.textContent='Imagem preparada. A leitura automática será ativada quando a IA estiver configurada.'};sendBtn.onclick=()=>scanStatus.textContent='Envio preparado. A gravação real será ativada junto ao backend, banco de dados e IA.'}if(page==='chat'){chatSend.onclick=()=>{if(!chatInput.value.trim())return;const b=document.createElement('div');b.className='bubble';b.textContent=chatInput.value;document.querySelector('.messages').appendChild(b);chatInput.value=''}}}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));googleBtn.onclick=()=>{auth.classList.add('hidden');app.classList.remove('hidden');render('dashboard')};mobileMenu.onclick=()=>sidebar.classList.toggle('open');render('dashboard');</script></body></html>
